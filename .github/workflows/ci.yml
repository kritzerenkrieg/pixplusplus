# Q1: check every push and every pull request on Linux and Windows
# (J5; macOS dropped for now, 2026-11-21). Same checks as AGENTS.md: fmt, clippy (with and without the GUI), tests,
# release builds. Nothing is published.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The GUI's native file dialogs (rfd) build against GTK 3 on Linux.
      - name: Install GTK (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (CLI)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (GUI)
        run: cargo clippy --all-targets --features gui -- -D warnings
      - name: Tests
        run: cargo test --features gui
      - name: Release build (CLI and GUI)
        run: cargo build --release --features gui
